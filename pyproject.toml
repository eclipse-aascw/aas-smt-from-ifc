[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "aas-smt-from-ifc"
# NOTE (mristin):
# Do not forget to sync with __init__.py!
version = "0.0.1"

description = "Generate AAS Submodel Templates from IFC models."
readme = "README.md"
requires-python = ">=3.12"

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]

authors = [
    { name = "Marko Ristin", email = "marko@ristin.ch" }
]

dependencies = [
    "aas-core3.0>=1,<2",
    "icontract>=2,<3",
    "typing_extensions",
    "networkx==3.5"
]

[project.optional-dependencies]
dev = [
    "black==25.11.0",
    "mypy==1.19.0",
    "pylint==3.3.7",
    "coverage==7.8.1",
    "types-networkx==3.5.0.20251106",
]

[project.scripts]
aas-smt-from-ifc = "aas_smt_from_ifc.main:entry_point"

[project.urls]
repository = "https://github.com/aas-core-works/aas-smt-from-ifc"

[tool.setuptools.packages.find]
include = ["aas_smt_from_ifc"]
exclude = ["continuous_integration", "tests"]

# Development tooling
[tool]
[tool.black]
line-length = 88

[tool.pylint]
disable = [
    "unnecessary-lambda", "no-else-raise", "too-few-public-methods", "no-else-return",
    "too-many-locals", "too-many-branches", "too-many-return-statements",
    "duplicate-code", "broad-exception-caught", "unnecessary-comprehension",
    "too-many-statements", "too-many-lines", "use-dict-literal", "invalid-name",
    "too-many-arguments", "too-many-positional-arguments",
    "too-many-instance-attributes", "unnecessary-negation",
    "too-many-nested-blocks", "no-else-break", "too-many-public-methods",
    "unsubscriptable-object"
]
max-line-length = 120

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = "aas_core3_protobuf.*"
ignore_missing_imports = true
